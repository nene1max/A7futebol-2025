<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A7 Futebol - Escanteios ao Vivo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#000000">
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 1rem;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .jogo {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .chance-alta {
      color: #0f0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="A7 Futebol" style="width: 120px;"><br>
    <h1>A7 Futebol</h1>
    <p>Jogos ao vivo com chance de escanteios</p>
  </header>

  <main id="jogos">Carregando partidas ao vivo...</main>

  <script>
    const apiKey = '6bad84f7472bc9075b0aeb6ede8957f2';

    async function buscarJogos() {
      try {
        const resposta = await fetch('https://api.api-futebol.com.br/v1/ao-vivo', {
          headers: {
            Authorization: `Bearer ${apiKey}`
          }
        });

        if (!resposta.ok) throw new Error('Erro ao buscar jogos: ' + resposta.status);

        const dados = await resposta.json();
        const container = document.getElementById('jogos');
        container.innerHTML = '';

        if (!dados || dados.length === 0) {
          container.innerHTML = '<p>Nenhuma partida ao vivo no momento.</p>';
          return;
        }

        dados.forEach(jogo => {
          const totalEscanteios = jogo.escanteios_mandante + jogo.escanteios_visitante;
          const chance = Math.min(100, Math.floor(totalEscanteios * 7)); // Simulação

          const div = document.createElement('div');
          div.className = 'jogo';
          div.innerHTML = `
            <strong>${jogo.time_mandante.nome} x ${jogo.time_visitante.nome}</strong><br>
            Minuto: ${jogo.placar.minuto} | Escanteios: ${totalEscanteios}<br>
            <span class="${chance >= 75 ? 'chance-alta' : ''}">Chance de escanteio: ${chance}%</span>
          `;
          container.appendChild(div);
        });

      } catch (erro) {
        console.error('Erro:', erro);
        document.getElementById('jogos').innerHTML = '<p>Erro ao carregar os dados.</p>';
      }
    }

    buscarJogos();
    setInterval(buscarJogos, 60000); // atualiza a cada 1 min
  </script>
</body>
</html>
